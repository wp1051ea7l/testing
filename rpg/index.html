<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f1">
  <title>Tiny RPG · Testing</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <a class="back" href="../">← All tests</a>
    <br>
    <span class="status">Game</span>
    <h1>Tiny RPG</h1>
    <p>Every tile and character is drawn with canvas code, no images. Move with arrow keys or WASD, and walk into slimes to fight them. Find the key and defeat the slime king.</p>
    <canvas id="stage" width="512" height="384" aria-label="Top-down RPG game" tabindex="0"></canvas>
    <div class="hud" aria-live="polite">
      <span id="stats"></span>
      <span id="log"></span>
    </div>
    <div class="pad" aria-label="Movement controls">
      <button type="button" data-dir="up" aria-label="Up">▲</button>
      <button type="button" data-dir="left" aria-label="Left">◀</button>
      <button type="button" data-dir="down" aria-label="Down">▼</button>
      <button type="button" data-dir="right" aria-label="Right">▶</button>
    </div>
    <div class="row">
      <button id="restart" type="button" class="secondary">Restart</button>
    </div>
  </main>
</body>
</html>
