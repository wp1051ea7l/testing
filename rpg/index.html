<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Tiny RPG · Testing</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div id="stage">
    <canvas id="game" aria-label="Top-down RPG. Move with arrow keys or WASD, walk into slimes to fight." tabindex="0"></canvas>
    <div class="buttons">
      <button id="fullscreen" type="button" aria-label="Toggle fullscreen" hidden>⛶</button>
      <button id="restart" type="button" aria-label="Restart">↻</button>
      <a href="../" aria-label="Back to all tests">✕</a>
    </div>
    <div class="pad" aria-label="Movement controls">
      <button type="button" data-dir="up" aria-label="Up">▲</button>
      <button type="button" data-dir="left" aria-label="Left">◀</button>
      <button type="button" data-dir="down" aria-label="Down">▼</button>
      <button type="button" data-dir="right" aria-label="Right">▶</button>
    </div>
  </div>
  <div class="rotate" role="alert">
    <span>⟳</span>
    Rotate your device to landscape
  </div>
</body>
</html>
